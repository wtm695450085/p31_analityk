services:
  analityk:
    build: .
    container_name: p31_analityk
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8531:8000"
    volumes:
      - ./data:/srv/data
    networks:
      default: {}
      n8n:
        aliases: [analityk]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  n8n:
    external: true
    name: n8n_default
